<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jorge Sandoval Gonzalez: Sprite Animation F2025</title>
    <link rel="stylesheet" href="m-style.css">
    <script src="m-script.js" defer></script>
</head>

<body>

    <header>
        <p><b>Jorge Sandoval Gonzalez<br>Sprite Animation F2025</b></p>
    </header>

    <!-- This is our canvas element where the fire animation will be drawn. -->
    <img id="mandrake" src="https://www.frankslaboratory.co.uk/downloads/105/mandrake.png">

    <div id="container">
        <div id="controls">
            <p>Play animation:</p>
            <input type="radio" name="animation" id="all" checked />
            <label for="all">All</label><br>
            <input type="radio" name="animation" id="grow" />
            <label for="grow">Grow</label>
            <input type="radio" name="animation" id="wink" />
            <label for="wink">Wink</label>
            <input type="radio" name="animation" id="float" />
            <label for="float">Float</label>
            <input type="radio" name="animation" id="hide" />
            <label for="hide">Hide</label>
        </div>
        <canvas id="canvas1"></canvas>
    </div>

</body>

</html>
